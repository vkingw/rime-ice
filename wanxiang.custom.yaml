patch:
  switches:
    - name: ascii_mode
      states: [中, A]
    - name: ascii_punct
      states: [中标, 英标]
    - name: full_shape
      states: [半角, 全角]
    - name: emoji
      states: [💀, 😄]
    - name: english_chinese
      states: [翻译关, 英译中]
    - name: context_reorder
      states: [上下文关, 上下文开]
    - options: [raw_input, tone_display, full_pinyin]
      states: [原编码, 有声调, 无声调]
      #reset: 2     #对于开关组从0开始数，第几个就reset几可设为默认
    - options: [s2s, s2t, s2hk, s2tw]
      states: [简体, 通繁, 港繁, 臺繁]
    - name: abbrev
      states: [简码关, 简码开]
      reset: 1
    - options: [comment_off, tone_hint, toneless_hint]
      states: [注释关, 有声调, 无声调]
    - name: super_tips
      states: [提示关, 提示开]
    - name: charset_filter
      states: [大字集, 小字集]
    - name: char_priority
      states: [词组先, 单字先]
    - name: english
      reset: 1
      states: [英文关, 英文开]